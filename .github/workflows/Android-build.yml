name: Build Android

on:
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      # --------------------------------------------------
      # 1. Checkout
      # --------------------------------------------------
      - name: Checkout
        uses: actions/checkout@v4

      # --------------------------------------------------
      # 2. PHP
      # --------------------------------------------------
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: sqlite3, pdo_sqlite, fileinfo, mbstring, openssl, curl, zip, gd, intl, exif
          tools: composer:v2
          ini-values: memory_limit=2G

      # --------------------------------------------------
      # 3. Node.js
      # --------------------------------------------------
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      # --------------------------------------------------
      # 4. Java
      # --------------------------------------------------
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # --------------------------------------------------
      # 5. Android SDK
      # --------------------------------------------------
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-36"
          sdkmanager "build-tools;36.0.0"
          yes | sdkmanager --licenses || true

      # --------------------------------------------------
      # 6. Python
      # --------------------------------------------------
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # --------------------------------------------------
      # 7. Composer
      # --------------------------------------------------
      - name: Install PHP dependencies
        run: |
          composer config platform-check false
          composer install --no-interaction --prefer-dist --optimize-autoloader --ignore-platform-reqs

      # --------------------------------------------------
      # 8. Laravel environment & App ID
      # --------------------------------------------------
      - name: Create .env
        run: |
          cp .env.example .env
          echo "NATIVEPHP_APP_ID=com.proto.x24" >> .env
          php artisan key:generate --no-interaction


      # --------------------------------------------------
      # 10. Install NativePHP Android
      # --------------------------------------------------
      - name: Install NativePHP Android
        run: |
          php artisan native:install android --force --no-interaction

      # --------------------------------------------------
      # 11. Build Debug APK (Auto-signé par Gradle)
      # --------------------------------------------------
      - name: Build Android APK
        run: |
          php artisan native:build android --build-type=debug --no-tty || php artisan native:run android --build=debug || true

      # --------------------------------------------------
      # 12. Find & Locate APK
      # --------------------------------------------------
      - name: Find APK
        run: |
          echo "Searching for APK files..."
          find . -type f -name "*.apk" -print

      # --------------------------------------------------
      # 13. Upload APK
      # --------------------------------------------------
      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: Proto-X-24-Android-APK
          path: |
            **/*.apk
          if-no-files-found: error
          retention-days: 30

      # --------------------------------------------------
      # 14. Debug information if build fails
      # --------------------------------------------------
      - name: Debug logs
        if: failure()
        run: |
          echo "===== NativePHP directories ====="
          find nativephp -maxdepth 4 -type d 2>/dev/null || true

          echo "===== Android build outputs ====="
          find . -type f \( -name "*.apk" -o -name "*.aab" \) -print 2>/dev/null || true

          echo "===== Laravel log ====="
          if [ -f storage/logs/laravel.log ]; then
            cat storage/logs/laravel.log
          fi